[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-text-transfer"
version = "0.2.0"
description = "Auditable text-only preparation and restoration for controlled file transfers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["controlled-transfer", "file-integrity", "security", "text-files"]
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://github.com/dgomez407/ctt"
PyPI = "https://pypi.org/project/controlled-text-transfer/"
Repository = "https://github.com/dgomez407/ctt"
Issues = "https://github.com/dgomez407/ctt/issues"
Changelog = "https://github.com/dgomez407/ctt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
blake3 = ["blake3>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "black>=24", "mypy>=1.10", "bandit>=1.7", "pyinstaller>=6", "build>=1", "twine>=6"]

[project.scripts]
ctt = "controlled_text_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D"]
ignore = ["S603", "S607", "UP045"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
[tool.black]
line-length = 100
target-version = ["py312"]
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
[tool.pytest.ini_options]
addopts = "--cov=controlled_text_transfer --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/controlled_text_transfer/__main__.py"]
